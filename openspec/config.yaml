schema: spec-driven

# Project context
# 技术栈与项目约定，AI 生成产出物时会参考此处
context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。

  技术栈：Rust（Cargo workspace，edition 2024）、Tauri 2.x、React 18 + Vite + TypeScript + Tailwind + shadcn/ui
  运行平台：Windows（overlay 透明置顶点击穿透依赖 Win32 API）
  项目定位：Peregrine 是桌面视觉锚点（overlay）工具，主要用于缓解 3D 晕眩

# Per-artifact rules (optional)
# 为特定产出物添加自定义规则
rules:
  proposal:
    - 提案需用简体中文撰写
    - 包含明确的"目标"和"非目标"小节
  design:
    - 设计文档需用简体中文撰写
    - 技术术语如 "API"、"Win32"、"winit"、"softbuffer"、"Tauri" 等可保留英文
  tasks:
    - 任务列表需用简体中文撰写
    - 每个任务拆分为可独立验证的最小单元
  spec:
    - 规格文档需用简体中文撰写
    - 代码示例和文件路径保留原文

# Per-operation guidance (optional)
# apply / archive 执行时的附加指引，由 /opsx:apply、/opsx:archive 流程消费
operations:
  apply:
    guidance:
      - 第一步必须创建专属工作分支（feature/<change-name>），禁止在 main/master 上直接提交实现代码
      - 在 main/master 上直接创建分支即可；若当前已在非 main/master 分支，须先与用户确认基于当前分支还是基于 main
      - 所有 tasks.md 任务完成后，最后一步必须通过 gh 创建 PR，并把 PR 编号写回 change 的 .openspec.yaml（pr: <number>）
      - PR 标题使用 conventional commits（feat/fix/refactor/docs/build），body 引用对应 issue（Closes #<n>）
  archive:
    guidance:
      - 归档前置硬门禁：change 对应的 PR 必须已 merged，未合并禁止归档（不可跳过）
      - 归档完成后自动切回默认分支（main 优先，回退 master）并 git pull --ff-only 拉取最新
